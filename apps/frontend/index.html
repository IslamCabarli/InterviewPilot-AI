<!doctype html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)" />
  <title>InterviewPilot AI — AI ilə texniki müsahibə təcrübəsi</title>
  <meta
    name="description"
    content="Səslə danış, AI müsahibəçi real vaxtda sual versin və cavabını qiymətləndirsin. Açıq mənbə, lokal işləyir."
  />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="InterviewPilot AI" />
  <meta
    property="og:description"
    content="Texniki müsahibəyə AI müsahibəçi ilə hazırlaş. Açıq mənbə, lokal işləyir."
  />
  <script>
    ;(function () {
      try {
        var t = localStorage.getItem('theme') || 'system'
        var dark =
          t === 'dark' ||
          (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    })()
  </script>
</head>
<body>
<noscript>InterviewPilot AI işləmək üçün JavaScript tələb edir.</noscript>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
